name: Soufflé Therapeutics
description: 'Soufflé Therapeutics is a genetic medicine company developing nucleic
  acid (siRNA) therapeutics that use proprietary cell-specific ligand-conjugation
  technology to target and deliver treatments to specific cell types. Its initial
  programs address muscle and heart disorders, with first therapies targeting
  Facioscapulohumeral Muscular Dystrophy (FSHD) and genetically-driven cardiomyopathies,
  with clinical trials expected to begin in 2026. The company is headquartered in
  Watertown, Massachusetts and was surfaced through the API Evangelist network as a
  portfolio company of Bessemer Venture Partners. It is a therapeutics/pharmaceutical
  company and publishes no public API, developer portal, or SDK surface.'
